<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>新航道香港项目 · 本地客户分析</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231d5044%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><header><strong>新航道香港项目 · 客户分析工具</strong><span>浏览器本地处理 · 数据不上传</span></header><main><h1>导入答卷，逐项复核，安排跟进。</h1><p>请从腾讯问卷后台导出您有权访问的CSV，再在此导入。答卷只在当前浏览器内存中处理，不保存到网站；刷新或关闭后须重新导入。PDF、ZIP和汇总CSV由浏览器生成，下载后请自行保存在受保护的位置。</p><section class="panel"><label>腾讯问卷CSV <input id="file" type="file" accept=".csv,text/csv"></label><label>编码 <select id="encoding"><option value="utf-8">UTF-8</option><option value="gb18030">GB18030（中文乱码时选择）</option></select></label><button id="sample" disabled>载入12份模拟客户</button><label>自定义版本规则 <input id="ruleFile" type="file" accept=".json"></label><p id="ruleVersion"></p><details><summary>CSV字段映射（导入后检查，再评分）</summary><div id="mapping"></div></details><button id="analyze" disabled>确认映射并评分</button><button id="clear" class="secondary">清空本页数据</button><p id="status" role="status" aria-live="polite">工具正在初始化；若此提示一直不变，请刷新页面。请勿直接打开HTML文件。</p><noscript>浏览器未启用JavaScript，无法分析答卷，请启用后刷新。</noscript></section><section class="panel"><label>客户等级 <select id="level"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>排序 <select id="sort"><option value="score">转化等级／C分降序</option><option value="date">提交日期原文降序</option></select></label><button id="csv" disabled>下载当前筛选汇总CSV</button><button id="zip" disabled>下载当前筛选PDF ZIP</button><p id="count"></p><div class="table-wrap"><table><thead><tr><th>客户编号</th><th>提交日期</th><th>孩子年级</th><th>联系方式</th><th>H</th><th>S</th><th>A</th><th>综合C</th><th>等级</th><th>查看</th></tr></thead><tbody id="clients"></tbody></table></div></section><section id="detail" class="panel" hidden></section><p>评分仅反映初步业务匹配和跟进优先级，不代表大学录取、签证获批或真实成交概率。</p></main><script defer src="bootstrap.js"></script></body></html>
